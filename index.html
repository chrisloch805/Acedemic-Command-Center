<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Academic Command Center</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header><div><h1>Academic Command Center</h1><p>Fall 2026 · syllabus-driven academic operating system</p></div><button id="resetDemo" class="secondary">Restore semester data</button></header><section class="stats" id="stats"></section><main><section class="panel overview"><div class="section-title"><h2>Your Courses</h2><button id="addCourseBtn">+ Course</button></div><div id="courseList" class="course-list"></div></section><section class="panel priorities"><div class="section-title"><h2>Priority Queue</h2><span id="today"></span></div><div id="assignmentList"></div></section><section class="panel add-assignment"><h2>Add Assignment</h2><form id="assignmentForm"><label>Course<select id="course"></select></label><label>Assignment<input id="title" required></label><div class="grid"><label>Due date<input id="due" type="date" required></label><label>Grade impact %<input id="weight" type="number" min="0" max="100" step="0.1" value="0"></label></div><div class="grid"><label>Estimated hours<input id="hours" type="number" min="0.25" step="0.25" value="2"></label><label>Difficulty<select id="difficulty"><option value="1">1 – Easy</option><option value="2">2</option><option value="3" selected>3 – Moderate</option><option value="4">4</option><option value="5">5 – Hard</option></select></label></div><button type="submit">Add to command center</button></form></section><section class="panel strategist"><h2>Study Strategist</h2><div id="strategist"></div></section></main></div><dialog id="courseDialog"><form method="dialog" id="courseForm"><h2>Add Course</h2><label>Course name<input id="courseName" required></label><label>Current grade %<input id="currentGrade" type="number" min="0" max="100" step="0.1" value="0"></label><menu><button value="cancel" class="secondary">Cancel</button><button value="default">Save course</button></menu></form></dialog><script src="semester-data.js"></script><script src="app.js"></script></body></html>
